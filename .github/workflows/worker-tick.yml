name: worker-tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up service
        env:
          BASE_URL: ${{ secrets.DOMINATOR_BASE_URL }}
        run: |
          curl -fsS --max-time 45 "$BASE_URL/healthz" >/dev/null
          echo "Warm-up OK"

      - name: Call worker tick endpoint (fail on non-2xx)
        env:
          BASE_URL: ${{ secrets.DOMINATOR_BASE_URL }}
          TOKEN: ${{ secrets.WORKER_TICK_TOKEN }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$TOKEN" ]; then
            echo "Missing secrets: DOMINATOR_BASE_URL or WORKER_TICK_TOKEN"
            exit 1
          fi

          echo "Ticking: $BASE_URL/internal/worker-tick?limit=1"
          curl -fsS --retry 3 --retry-all-errors --max-time 60 \
            -X POST "$BASE_URL/internal/worker-tick?limit=1" \
            -H "X-Worker-Token: $TOKEN" \
            -H "Content-Type: application/json"
          echo ""
