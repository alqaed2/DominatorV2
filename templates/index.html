<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Dominator V2 — UI</title>
  <style>
    body{font-family:system-ui,Segoe UI,Tahoma,Arial; margin:16px; background:#0b0f14; color:#e8eef6}
    .card{background:#111826; border:1px solid #233047; border-radius:14px; padding:14px; margin:12px 0}
    input, textarea, select{width:100%; padding:10px; border-radius:10px; border:1px solid #2b3a55; background:#0b1220; color:#e8eef6}
    button{padding:10px 14px; border-radius:10px; border:1px solid #2b3a55; background:#17233a; color:#e8eef6; cursor:pointer}
    button:hover{background:#1f3152}
    pre{white-space:pre-wrap; background:#060a10; border:1px solid #233047; border-radius:12px; padding:12px; overflow:auto}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    @media (max-width:900px){ .row{grid-template-columns:1fr} }
    .hint{opacity:.85; font-size:13px}
  </style>
</head>
<body>
  <h2>AI Dominator V2 — اختبار API من المتصفح</h2>
  <div class="hint">هذه الصفحة تعمل عبر POST باستخدام fetch. افتحها من نفس الدومين ثم جرّب الأزرار.</div>

  <div class="card">
    <h3>1) Onboard</h3>
    <div class="row">
      <div>
        <label>Display name</label>
        <input id="display_name" value="Mohammad" />
      </div>
      <div>
        <label>Primary niche</label>
        <input id="primary_niche" value="التسويق الرقمي" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Goal</label>
        <select id="goal">
          <option value="followers" selected>followers</option>
          <option value="sales">sales</option>
          <option value="leads">leads</option>
        </select>
      </div>
      <div>
        <label>Tone</label>
        <select id="tone">
          <option value="educational" selected>educational</option>
          <option value="storytelling">storytelling</option>
          <option value="humorous">humorous</option>
        </select>
      </div>
    </div>
    <label>Sub niches (comma separated)</label>
    <input id="sub_niches" value="TikTok, Branding, AI" />
    <div style="margin-top:10px">
      <button onclick="doOnboard()">POST /v1/onboard</button>
    </div>
  </div>

  <div class="card">
    <h3>2) Daily Brief</h3>
    <label>Creator ID</label>
    <input id="creator_id" placeholder="سيتم تعبئته تلقائيًا بعد Onboard" />
    <label style="margin-top:10px">n_ideas</label>
    <input id="n_ideas" type="number" value="3" />
    <div style="margin-top:10px">
      <button onclick="doDailyBrief()">POST /v1/daily-brief</button>
    </div>
  </div>

  <div class="card">
    <h3>3) Build Pack</h3>
    <label>Creator ID</label>
    <input id="creator_id2" placeholder="انسخ Creator ID هنا" />
    <label style="margin-top:10px">Idea title</label>
    <input id="idea_title" value="3 خطوات سريعة لتحسين نتائجك في التسويق الرقمي" />
    <label style="margin-top:10px">Angle</label>
    <input id="angle" value="قائمة خطوات قابلة للحفظ" />
    <label style="margin-top:10px">Value promise</label>
    <input id="value_promise" value="خطة بسيطة: نفّذ، قِس، عدّل." />
    <div class="row" style="margin-top:10px">
      <div>
        <label>Preferred length (sec)</label>
        <input id="preferred_length_sec" type="number" value="28" />
      </div>
      <div>
        <label>Mode</label>
        <select id="mode">
          <option value="both" selected>both</option>
          <option value="manual">manual</option>
        </select>
      </div>
    </div>
    <div style="margin-top:10px">
      <button onclick="doBuildPack()">POST /v1/build-pack</button>
    </div>
  </div>

  <div class="card">
    <h3>النتيجة</h3>
    <pre id="out">—</pre>
  </div>

<script>
  function show(obj){
    document.getElementById('out').textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  }

  async function postJSON(path, body){
    const res = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type':'application/json; charset=utf-8'},
      body: JSON.stringify(body)
    });
    const text = await res.text();
    let data;
    try{ data = JSON.parse(text); } catch(e){ data = text; }
    if(!res.ok){
      throw new Error((data && data.error) ? data.error : ("HTTP " + res.status));
    }
    return data;
  }

  async function doOnboard(){
    try{
      const sub = document.getElementById('sub_niches').value.split(',').map(s=>s.trim()).filter(Boolean);
      const payload = {
        display_name: document.getElementById('display_name').value,
        goal: document.getElementById('goal').value,
        primary_niche: document.getElementById('primary_niche').value,
        sub_niches: sub,
        language: "ar",
        tone: document.getElementById('tone').value,
        constraints: {},
        tiktok_profile_url: null,
        top_video_urls: [],
        weak_video_urls: [],
        past_scripts: []
      };
      const data = await postJSON('/v1/onboard', payload);
      show(data);
      if(data.creator_id){
        document.getElementById('creator_id').value = data.creator_id;
        document.getElementById('creator_id2').value = data.creator_id;
      }
    }catch(e){ show(String(e)); }
  }

  async function doDailyBrief(){
    try{
      const payload = {
        creator_id: document.getElementById('creator_id').value,
        n_ideas: Number(document.getElementById('n_ideas').value || 3)
      };
      const data = await postJSON('/v1/daily-brief', payload);
      show(data);
    }catch(e){ show(String(e)); }
  }

  async function doBuildPack(){
    try{
      const payload = {
        creator_id: document.getElementById('creator_id2').value,
        idea_title: document.getElementById('idea_title').value,
        angle: document.getElementById('angle').value,
        value_promise: document.getElementById('value_promise').value,
        preferred_length_sec: Number(document.getElementById('preferred_length_sec').value || 28),
        mode: document.getElementById('mode').value
      };
      const data = await postJSON('/v1/build-pack', payload);
      show(data);
    }catch(e){ show(String(e)); }
  }
</script>
</body>
</html>
