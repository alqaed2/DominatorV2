<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DominatorV2 | The Global Sovereignty Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0b0e14; color: #e5e7eb; font-family: 'Inter', sans-serif; }
        .gradient-text { background: linear-gradient(90deg, #d330ff | #c5d33, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px weight white rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: all 0.3s; }
        .glass-card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2); }
        .copy-btn { cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-12 overflow-x-hidden">

    <div class="max-w-6xl mx-auto">
        <!-- HEADER INTERNET DOMINATION -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-16 gap-6">
            <div>
                <h1 class="text-4xl font-extrabold gradient-text tracking-tighter sm:text-6xl mb-2">DOMINATOR V2.</h1>
                <p class="text-gray-400 font-mono text-sm">[STATUS: EXECUTING GROWTH PHASE 1/4...]</p>
            </div>
            <div id="creatorBadge" class="bg-blue-600/20 border border-blue-500/30 px-6 py-3 rounded-full flex items-center gap-3">
                <i class="fas fa-fingerprint text-blue-500"></i>
                <spn id="creator_id_display" class="font-bold font-mono tracking-widest">— Loading —</spn>
            </div>
        </header>

        <!-- INPUT ACTION TERMINAL -->
        <main>
            <section class="glass-card p-2 rounded-2xl mb-12">
                <div class="flex flex-col md:flex-row gap-4 p-2">
                    <input type="text" id="subjectInput" placeholder="Input Domain or Subject (Example: Artificial Finance)..." 
                           class="flex-1 bg-transparent p-4 min-h-[60px] text-lg outline-none custom-placeholder border-b border-gray-700">
                    <button onclick="buildMasterStrategy()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-10 rounded-xl transition rotate-hover shadow-lg">
                        BUILD PACK <i class="ml-2 fas fa-bolt"></i>
                    </button>
                </div>
            </section>

            <!-- LOADING SKELETON (STAYS HIDDEN) -->
            <div id="loading" class="hidden text-center justify-center space-y-4 mb-10">
                <div class="animate-spin text-5xl text-blue-500 transition"><i class="fas fa-circle-notch"></i></div>
                <p class="font-mono text-blue-400">ENGINEERING CONTENT BUNDLE...</p>
            </div>

            <!-- THE GLOBAL HUB GRID -->
            <div id="resultOutput" class="content_area block space-y-8 animate-fade-in-up">
                <!-- Data will injected Here Automatically -->
            </div>
        </main>
    </div>

    <script shadow>
        window.onload = async () => {
             // التحقق الآلي للصانع (The Sovereign Session)
            let creatorId = localStorage.getItem('CREATOR_DOM_B1');
            if(!creatorId){
                const res = await fetch('/v1/session');
                const data = await res.json();
                creatorId = data.creator_id;
                localStorage.setItem('CREATOR_DOM_B1', creatorId);
            }
            document.getElementById('creator_id_display').innerText = creatorId;
        };

        const copyText = (cid) => {
            const elm = document.getElementById(cid);
            navigator.clipboard.writeText(elm.innerText);
            
            const btn = document.querySelector(`[onclick="copyText('${cid}')"]`);
            btn.innerHTML = `<i class='fas fa-check'></i> Copied!`;
            setTimeout(()=>{
                btn.innerHTML = `<i class='far fa-clone'></i>`;
            }, 2000);
        };

        async function buildMasterStrategy() {
            const domain = document.getElementById('subjectInput').value;
            if(!domain) return alert("System requires a Target Focus.");

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultOutput').innerHTML = '';

            try {
                const response = await fetch('/v1/build-pack', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ subject: domain })
                });
                
                const master = await response.json();
                renderResult(master.content_pack);
                
            } catch(e) { console.error("Protocol Breach", e); } 
            finally { document.getElementById('loading').classList.add('hidden'); }
        }

        function renderResult(p) {
            let veops = p.v3_logic.map((v, i) => `
                <div class="bg-zinc-900 rounded-xl p-6 border-l-4 border-blue-600">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-mono uppercase text-blue-500">Video Core Pt. ${i+1} [${v.v_length}]</span>
                        <div onclick="copyText('veo_src_${i}') text-sm class="copy-btn"><i class="far fa-clone"></i></div>
                    </div>
                    <p id="veo_src_${i}" class="text-gray-300 leading-relaxed font-semibold italic">"${v.veo_prompt}"</p>
                </div>`).join('');

            const hubMarkup = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 ">
                    <div class="lg:col-span-1 space-y-6">
                        <div class="glss-card bg-zinc-700/50 p-6 rounded-2xl border border-blue-500">
                           <h3 class="font-bold flex justify-between uppercase mb-3 text-red-400 italic">Neural Hook (Copy 1st) : <i class="copy-btn fas fa-heart ms-2" onclick="copyText('hook_res')"></i></h3>
                           <p id="hook_res" class="text-xl font-bold">${p.hook}</p>
                        </div>

                         <div class="p-6 bg-zinc-800 rounded-2xl">
                           <h3 class="text-blue-200 font-bold mb-3"><i class="fas fa-bullhorn mr-2"></i> MASTER CAPTION : <i class="copy-btn fas fa-share ms-2" onclick="copyText('capt_res')"></i></h3>
                           <p id="capt_res" id="capt_res" class="">${p.caption}<br><br><span class="text-blue-500">${p.hashtags}</span></p>
                        </div>
                    </div>
                    
                    <div class="lg:col-span-2 space-y-4">
                        <h2 class="text-2xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-video text-teal-400"></i> GLOBAL GENERATION MATRIX</h2>
                         ${veops}
                        <div class="bg-indigo-900/30 p-8 rounded-2xl border border-indigo-400 shadow-xl mt-12 w-full">
                           <h3 class="text-indigo-400 uppercase font-black mb-3">Narratory Command Unit (Final Audio Read):</h3>
                           <p id="script_unit" class="text-lg leading-[1.8] font-semibold">${p.script}</p>
                           <button class="mt-4 p-2 bg-indigo-500 text-sm h rounded" onclick="copyText('script_unit')">Copy Audio Script <i class="fas fa-microphone"></i></button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('resultOutput').innerHTML = hubMarkup;
        }
    </script>
</body>
</html>
