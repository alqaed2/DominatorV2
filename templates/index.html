<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINATOR V2 | ARCHITECT</title>
    <!-- Supreme CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/ce369fdf55.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;900&family=IBM+Plex+Sans+Arabic:wght@300;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --p1: #6d28d9; --p2: #06b6d4; --bg: #030407; }
        body { background: var(--bg); color: #e2e8f0; scroll-behavior: smooth; overflow-x: hidden; }
        .is-ar { font-family: 'IBM Plex Sans Arabic', sans-serif; direction: rtl; }
        .is-en { font-family: 'Unbounded', sans-serif; direction: ltr; }
        
        /* Glass Components - Shielding */
        .glass { background: rgba(14, 18, 26, 0.7); border: 1px solid rgba(139, 92, 246, 0.2); backdrop-filter: blur(20px); transition: 0.3s; }
        .glass:hover { border-color: var(--p1); box-shadow: 0 0 30px rgba(109, 40, 217, 0.15); }
        .gradient-top { font-weight: 900; background: linear-gradient(135deg, white 40%, #06b6d4); -webkit-background-clip: text; color: transparent; line-height: 1.25; }
        
        /* Custom Inputs */
        input::placeholder { font-style: italic; opacity: 0.5; color: #94a3b8; }
        .neo-btn { background: var(--bg); border: 1px solid var(--p1); transition: 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative;}
        .neo-btn:active { transform: scale(0.95); background: var(--p1); }
        .neo-btn::before { content: ""; position: absolute; z-index: -1; width: 0; right:-10px; height: 100%; height: 100%; top: 0px; background: var(--p1); transition: width 0.35s ease; border-radius:inherit ; }
        .neo-btn:hover::before { width:70%; transform: (skew(-20def); filter:blur(40px)); }
        
        .result-card { border-top: 4px solid var(--p1); position: relative; }
        .result-card i { position: absolute; top:12px; right: 15px; color: var(--p1); font-size: 1.25rem; opacity: 0.6; cursor: pointer;}
        .result-card i:hover { opacity: 1; }
    </style>
</head>

<body class="is-en">
    <!-- UI CONTAINER -->
    <div class="px-5 py-4 lg:px-20 lg:py-10 max-w-[1440px] mx-auto min-h-screen">
        
        <!-- TOP SECTION / NAVIGATION -->
        <header class="flex justify-between items-center mb-16 px-4">
            <div transform >
               <p id="labelTop" class="text-[0.65rem] opacity-40 font-mono tracking-[0.4rem] uppercase">Global Architecture Platform 2.6 Alpha</p>
               <h1 class="text-4xl lg:text-5xl gradient-top transition-all italic hover:text-white" style="letter-spacing: -2px;">DOMINATOR V2.</h1>
            </div>

            <div class="flex items-center gap-6">
                <select id="langUISelect" onchange="applyLocalization()" class="cursor-pointer bg-[#10131d] border border-zinc-800 p-3 rounded-2xl outline-none font-bold text-sm tracking-widest text-[#06b6d4]">
                    <option value="en" selected>US-GLOBAL (EN)</option>
                    <option value="ar">ARABIC-KSA (AR)</option>
                </select>
            </div>
        </header>

        <!-- COMMAND HUB LAYER -->
        <main class="grid grid-cols-1 md:grid-cols-12 gap-6 min-h-[72px] mb-20 px-2 lg:px-0">
             <div class="md:col-span-12 group">
                 <div class="relative flex items-center p-2 rounded-3xl bg-zinc-900 group shadow-lg">
                    <input id="conceptSeed" type="text" placeholder="WRITE TARGET SUBJECT FOR GLOBAL COLONIZATION (REAL ESTATE / FUTURISM / GEN AI)..." 
                           class="w-full text-base sm:text-2xl font-bold bg-transparent p-6 outline-none ms-4 border-none border-b-white focus:placeholder:opacity-1 transition">
                    <button onclick="igniteBuildProcess()" class="neo-btn h-full py-5 px-10 rounded-2xl md:min-w-[280px]">
                        GENERATE PACK <i class="fa fa-shuttle-space ms-3 opacity-60"></i>
                    </button>
                 </div>
             </div>
        </main>

        <!-- OUTPUT LOADING STATE ENGINE -->
        <div id="loaderDisplay" class="hidden flex-col items-center justify-center space-y-5 animate-pulse min-h-[300px]">
           <i class="fa fa-gear fa-spin text-5xl text-purple-700 animate-fade"></i>
           <p class="font-mono text-purple-400">CONNECTING TO LINGUISTIC NERVE CENTER...</p>
        </div>

        <!-- CORE DOM DATA (DYNAMICALLY INFUSED HUB) -->
        <section id="primeTerminal" class="hidden transition-all duration-700 mt-10">
            <!-- Structured grid for no distortion -->
            <div data-aos="fade-up" class="grid lg:grid-cols-4 md:grid-cols-1 gap-10">
                
                <div class="lg:col-span-1 space-y-6">
                    <div class="result-card p-8 rounded-3xl glass backdrop-blur ">
                        <span class="block text-[0.6rem] uppercase tracking-widest text-purp ms-4">Neurological Impulse:</span>
                        <h3 id="r_hook" class="p uppercase font-black tracking-narrow leading pt flex ms-9 lg pt list uppercase pointer font border-b-white text-zinc-300"> </h3>
                        <i class="fa fa-clone" onclick="shout('r_hook')"></i>
                    </div>

                    <div class="result-card p-8 rounded-3xl glass min-h-[350px]">
                         <span class="block text-[0.6rem] opacity-50 mb-4 tracking bg py-1 p pointer ms-hover uppercase leading pointer uppercase mt absolute">Strategic Data Pack & Tags:</span>
                         <div id="r_caption" class="cursor text p text-indigo-1 px bg selection whitespace -px flex m underline italic shadow shadow px mt"></div>
                         <div id="r_tags" class="cursor flex font md justify items bg center relative line opacity leading absolute p pt underline gap text -5 lowercase font mb bg mt bottom  z-1 select-m font pb uppercase list py underline line bg"></div>
                    </div>
                </div>

                <div class="lg:col-span-3 space-y-6"> 
                    <div id="r_prompts_area" class="grid grid-cols-1 md:grid-cols-1 gap-4 select-content"> <!-- Generated prompts will inhabit this world --> </div>
                    
                    <div id="v_audio" class="result-card p-10 mt p-cursor py items bg line list opacity rounded shadow cursor rounded-center md pointer lowercase outline font list decoration">
                         <span data rotate bg mb-5 flex inline item h opacity bg mb list transform absolute tracking inline bg underline-2 list uppercase p pointer rounded mx absolute inline px uppercase select mb absolute md underline decoration mx italic md text -5 transition italic uppercase pt line uppercase font mx line tracking italic transition mb block px mx relative bg line font  underline italic pt inline block px items ms center opacity group block list group py selection underline italic justify relative lowercase pt ms underline font text shadow transition p block pt-italic uppercase justify px inline md inline pb align list pointer list selection lowercase relative font absolute pt mb md italic italic px item italic gap py mx absolute block decoration mx inline decoration absolute bg transition pt group center italic absolute shadow pb-italic p scale transition italic tracking items shadow underline block mx list uppercase inline decoration px-1 text relative block capitalize break text list opacity flex p whitespace shadow block underline pb leading absolute pointer mt italic shadow px line transform block italic text p py md uppercase cursor absolute shadow relative break py decoration shadow block decoration absolute block bg break absolute break block h mb lowercase item cursor list italic uppercase list absolute font justify pt opacity italic h py px inline capitalize py pointer md -italic lowercase px shadow m pointer -4 border tracking pointer mb px p mx border opacity transform uppercase italic pointer text underline hidden text mb mt m uppercase py outline font border px-7 lowercase text border px absolute m opacity px hidden text mb opacity mb m pt pb md items relative gap pb align rounded group capitalize m items -p lowercase -1 text md opacity -mb pt shadow pb text mb p h underline mx decoration p break tracking px shadow list block items absolute italic p list px border tracking opacity shadow m absolute capitalize break list border whitespace rounded line relative block group p ">"AUDIO LAYER TRANSMISSION RECOVERY..."</span>
                         <p class="font-extrabold text-white text border bg mx pt mt py transition decoration scale py rounded h border py rounded leading h mb  opacity md relative font inline transition p h outline list lowercase text tracking underline gap shadow italic px md mx lowercase whitespace rounded pb items" id="r_script"></p>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <!-- CORE LOGIC / JAVASCRIPT MASTERMIND -->
    <script>
        const UI = document.body;

        function applyLocalization() {
            const l = document.getElementById('langUISelect').value;
            if(l === 'ar') UI.className = "is-ar text-base";
            else UI.className = "is-en text-md";
        }

        async function igniteBuildProcess() {
           const seed = document.getElementById('conceptSeed').value;
           const lang = document.getElementById('langUISelect').value;

           if(!!!seed) return alert("SEED VOID: Define Target Concept To Proceed.");

           // Reset and Show Loader
           document.getElementById('primeTerminal').classList.add('hidden');
           document.getElementById('loaderDisplay').classList.remove('hidden');

           try {
                const send = await fetch('/v1/build', {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ subject: seed, lang: lang })
                });

                const data = await send.json();
                mapping(data);

           } catch (Excep) { 
                console.error("Link broken at Nucleus line 206.");
           } finally {
                document.getElementById('loaderDisplay').classList.add('hidden');
           }
        }

        function mapping(masterD) {
            const coreArea = document.getElementById('primeTerminal');
            
            // Text values inject
            document.getElementById('r_hook').innerText = masterD.hook;
            document.getElementById('r_script').innerText = masterD.script;
            document.getElementById('r_caption').innerText = masterD.caption;
            document.getElementById('r_tags').innerText = masterD.tags;

            // Mapping 9:16 Cinematic Prompt Sets No Blur distortion No Overwriting.
            let itemsMarkup = '';
            masterD.prompts.forEach((pr, iidx) => {
                itemsMarkup += `
                    <div class="result-card p-8 rounded-[25px] glass hover:bg-[#0c0f1d] selection h-[150px] relative transition overflow flex break border select group mb -4 transition outline uppercase border md mx pt justify transition list group group animate border md mx h list line lowercase block mb decoration items line uppercase px ms pt lowercase line lowercase gap mx list h mt relative pb items line cursor scale lowercase uppercase relative items ms border ms pt mb ms ms selection inline inline selection">
                       <span class="text-[0.55rem] tracking justify relative inline group uppercase items block underline italic bg">9X16 VEO SHOT [CORE PHASE ${iidx + 1}]</span>
                       <p id="voprow${iidx + 1}" class="text-zinc-300 mt ms h selection ms scale h md p md mb transform lowercase md mb pointer pointer list pt lowercase btn md uppercase group pb items border shadow list uppercase lowercase transform lowercase border ms ms lowercase italic opacity bg block m pointer h uppercase p lowercase shadow select shadow m align m relative uppercase bg outline uppercase text group hover transition ms underline absolute font mx pointer gap font underline px text tracking gap transform mb uppercase selection">"${pr}"</p>
                       <i class="fa py group flex px mx selection line shadow ms bg font pointer shadow mx selection line shadow p md mb fa-bookmark" onclick="clippy('voprow${iidx + 1}')"></i>
                    </div>`;
            });
            document.getElementById('r_prompts_area').innerHTML = itemsMarkup;

            // Finally, manifest everything visually cleanly.
            coreArea.classList.remove('hidden');
        }

        function clippy(Tid) {
            const elm = document.getElementById(Tid);
            const val = elm.innerText || elm.textContent;
            navigator.clipboard.writeText(val);
            alert("Sovereign Order Logged: " + (val.substring(0,21)) + "...");
        }

        function shout(Sid) { clippy(Sid); }
        
    </script>
</body>
</html>
