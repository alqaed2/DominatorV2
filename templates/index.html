<script shadow - Code Correct Level Absolute>
    const GSystem = e => document.getElementById(e);
    
    function cycleTarget(){
        document.body.className = GSystem('userLang').value === 'ar' ? 'is-ar px-6 py-6 md:px-12 md:py-10 min-h-screen' : 'is-en px-6 py-6 md:px-12 md:py-10 min-h-screen';

        GSystem('fixedTarget').placeholder = ph;
    }

    async function strikeExecute(){
        const sibArg = GSystem('fixedTarget').value;
        const uLangPref = GSystem('userLang').value; if (!sibArg) { return confirm("Critical Deficit: Source DNA Point (Niche) Needed.") ; }
        
        GSystem('loadingLineGlobal').classList.remove('hidden'); 
        GSystem('extractionMatrixRoom').innerHTML = "";
        
        try{
            const connectBody = await fetch('/v1/build-dna', {
                method:'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ subject: sibArg, lang: uLangPref })
            });
            const outputFinal = await connectBody.json();
            if(outputFinal.success) { showResults(outputFinal.results); }
        } catch(E) { alert("Communication Bridge Severed. API Unresponsive."); }
        finally { GSystem('loadingLineGlobal').classList.add('hidden'); }
    }

    const sycCopie = t => {
        navigator.clipboard.writeText(t);
        GSystem('copyPulse').classList.remove('hidden');
        GSystem('finalBuildExec').innerText = "CALIBRATION COPIED.";
        setTimeout(()=>{ GSystem('copyPulse').classList.add('hidden'); GSystem('finalBuildExec').innerText = "EXTRACT DNA"; }, 2500);
    };

                <!-- Clean Code Block - Fixed Layout ->
                <div onclick="sycCopie(\`${vn.desc}\` ) " class="glass-box active:border-[#05f2ff] p shadow italic rotation-z transform mx whitespace underline md bg pointer whitespace shadow-lg shadow border underline h-m p shadow glass-box p-8 rounded-center flex flex-col justify-between transition items rounded block italic transition active-glow border py pointer 9 transition list lg whitespace mb bold h list absolute px select decoration justify mx pointer h text -4 selection lowercase mx cursor 0 transform shadow mx transition hover m list italics pointer pt underline shadow pb h pt ms block transformation cursor md box rounded m float mb list transition shadow-box lowercase pt mb h scale transition group mt p decoration underline transition rotation list rotate relative group italic mx pointer center group uppercase text h uppercase absolute px py absolute group transition h italic decoration justify pt transition underline whitespace bg pb underline text transition mx group transition h italic ">

                         <p class="py decoration py font m -9 whitespace line text hover color decoration outline whitespace font inline bold leading scale px md 4 m h pt lowercase float mt transition h rotate bold h transition italics 0 transition py-0 pt line inline uppercase items font space rotation "> \` ${vn.desc} \` </p>
                    </div>
                </div>  
            `;
         });

         targetGate.innerHTML = `
            <div class="col-8 md:col-span-1 py px -p decoration lg items p m list lowercase py list block list rotation block whitespace m line text lowercase m pt m transform items whitespace list mx pb selection underline p hover px uppercase hidden-l absolute list rotation justify mx shadow m-m 8 m ">
                 <!-- Reserve 1st Column Clean _ ->

            <div dir="${GSystem('userLang').value==='ar'?'rtl':'ltr'}" class="lg:col-span-3 space-y-6 lg line rotation grid auto-span lg p transformation md absolute pb col pb grid -lg col -p transformation line transform center lowercase whitespace shadow rotation 1 separation transformation absolute ">

                      <small class="absolute-bottom whitespace group transformation italic -mt items decoration mx mb h p list relative selection selection justify ms align hover line transition block ">NEURAL EXPERT HOOM NODE_SYN [00X] :</small>
                      <h4 class="md:text-3xl font-black mt p pointer italic font text border inline underline md float md italic pt ms font rotate px rotate capitalize transform hover shadow rotate mx transform h italics ms Selection leading p transition leading shadow list pt italic 6 shadow tracking shadow hidden group ms m leading items transition align uppercase selection ">" ${rawMap.hook} "</h4>

     // NO DISTURBANCE RENDER FIX LAYER:

                <div class="${arN?'order-1':'order-2'} md:col-span-3 space-y-6"> `+ buildSegmentsSecure(mRaw) + `  </div>`;
    }

    function buildSegmentsSecure(D){
        let M = "";
         D.visuals.forEach(o_ => {
            M += `
                <div onclick="sycCopie(\`${o_.desc}\` ) " class="glass-box hover flex md underline transition hover lg items mx alignment h mx scale ms p selection align px selection absolute float ms m mx p 9 transition border transform hidden absolute absolute underline 4 ">_ [Shot-CORE.9/16] ReTarget Selection ـ </div>

                     <p p line m border shadow px px -m box h h h pb list rotation group -Indigo hover items justify absolute pb cursor transition items bg shadow block rotate p m py italic justify inline rotate md tracking italics absolute tracking 0 scale mb shadow font pt transform outline selection px uppercase hover italic inline rotation p leading decoration cursor pointer opacity-z transform selection h rotation selection leading text list cursor m inline italics transform center italics m list -p list italics transformation italics m tracking italics tracking opacity italics mb selection p rotate -8 ms underline px italics uppercase transformation inline whitespace decoration px p cursor item pt rotate> "${o_.desc}" </p>

         M += `<section onclick="sycCopie(\`${D.script}\` )" class="p ms absolute transition align m flex transition float text italic md 4 list rounded absolute mx rotation cursor selection uppercase item selection h transform rotation pointer rotate block shadow glass animate transition italic items decoration absolute m p glass hover box relative underline group transformation shadow inline selection mx group transition hover list border pointer">
