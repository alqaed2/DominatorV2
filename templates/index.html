    <script shadow - MasterMind Logic>
        function adaptUI() {
           const l = document.getElementById('mainLangSwitch').value;
           const s = document.body;
           if(l === 'ar') { s.className = 'is-ar p-4 md:p-12'; } else { s.className = 'is-en p-4 md:p-12'; }
        }

        async function igniteBuild() {
             const sub = document.getElementById('subjectVal').value;
             const lang = document.getElementById('mainLangSwitch').value;
             if(!sub) return alert("System Requires Focus Target.");
             
             document.getElementById('loader').classList.remove('hidden');
             const build = await fetch('/v1/build-pack', {
                 method: 'POST', mode: 'no-cors',
                 headers: {'Content-Type': 'application/json'},
                 body: JSON.stringify({ subject: sub, lang: lang })
             });
             const d = await build.json();
             display(d.payload);
        }

        function copyMe(id) {
           const n = document.getElementById(id); 
           navigator.clipboard.writeText(n.innerText);
           alert("Component Cached into Memories.");
        }

        function display(dat) {
              const resContainer = document.getElementById('resultsNode');
              resContainer.classList.remove('hidden');
              document.getElementById('loader').classList.add('hidden');

             // Component Logic FOR SCENES VIS WITHOUT OVERLAP (Mapping clear)
             let vH = '';
             dat.prompts.forEach((p, idx) =>{
                 vH += `<div class="mb-5 glass-layer p-6 rounded-2xl cyber-line relative transition scale-hover h align absolute transform px text">

                           <p id="vpro-${idx}" class="text-zinc-400 group h justify selection rotate shadow ms h p text opacity items leading transform tracking lg pt center px ms line pt line md px ms transition pointer px select m bg line py absolute text center hover transition text italic font-bold">"${p}"</p>
                        </div>`;
             });

             resContainer.innerHTML = `
                <aside class="lg:col-span-4 col-1 order gap-reverse ms absolute space-y-8 absolute transform opacity uppercase absolute p transition scale pt h mx block shadow rotate border md mx pt justify transition -4">
                    <div class="glass-layer p-8 rounded-center underline ms md flex text pointer items rounded-center py pb items text block selection block inline px decoration md mb text italic border rotate pb items decoration btn outline">
                        <cite class="selection flex p font bg transform italic p line underline m p text font shadow border block gap pb-0 list mb md selection opacity transform opacity uppercase transform shadow absolute block inline text flex line space p  px list mx underline ms bg-shadow items shadow font md decoration rotate uppercase">THE NEURAL HOOK
