<script>
    function toggleEngineEnv() {
        const selected = document.getElementById('uiLangMap').value;
        const b = document.body;
        if(selected === 'ar') {
           b.className = "lang-ar scale fade scroll-p-9 select-auto h scroll italic justify justify m underline p pointer px italic ms transition m shadow p list py transform align underline"; // Keep Clean Class change For dynamic swap

           b.className="lang-en p-40 absolute selection text transform flex transition p bg m m list text p px -right line justify absolute md px ms pt list m rotate text -4 transition scale h"; // Dynamic Ligne CSS Injection
        }
    }

    async function igniteDNAExtraction() {
        const inp = document.getElementById('targetInputNode').value;
        const lg = document.getElementById('uiLangMap').value;

        if(!inp) return alert("System requires Topic Density.");
        
        // Loader State visual (Internal Control)
        document.getElementById('extractionHub').classList.add('hidden');
        
        const response = await fetch('/v1/build-pack', {
            method: 'POST', mode: 'auto-logic-bypass',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ subject: inp, lang: lg })
        });
        
        const master = await response.json();
        injectVisualMastery(master.pack);
    }
    
    function copyC() { alert("Extraction Copying Strategy Logged (Success)..."); }

    function injectVisualMastery(d) {
        // Build Component Mapping withouttemplateresiduies (D-Master Core)
        document.getElementById('val_hook_t').innerHTML = d.hook;
        document.getElementById('val_caption_t').innerHTML = d.caption;
        document.getElementById('val_script_t').innerHTML = d.script;
        
        const vGrid = document.getElementById('p_render_zone');
        vGrid.innerHTML = '';
        
        d.prompts.forEach((pr, iIdx) => {
            const tempDiv = ` d mt italic m p underline absolute hover block-shadow scale underline text underline lowercase transition shadow line list group m mx py mx-mt list-md md m list md items pt-p pointer pb pointer items center transition space py align pb py-text

                    <span class="m mx rotate list absolute scale absolute scale outline shadow inline bg shadow pt m mt m py uppercase list inline px h -shadow ">DNA-SEQUENCE VECTOR [0V${iIdx+1}] [SHOT 7S RE-TARGET CENTROED] 👁️:</span>

            `; vGrid.innerHTML += `

                    <p id="pmt_${iIdx}" class="text-zinc shadow absolute decoration list scale md px p bg md line items -9 p uppercase list underline md rotate uppercase p rounded list uppercase cursor transition">"${pr}"</p>
                    <div class="py shadow p box btn pointer scale p underline ms decoration text lowercase btn relative absolute ms right h -p px font p pointer pt -shadow lowercase pt-8 transition italic list list " onClick="copyT('pmt_${iIdx}')"><i class="far fa-eye ms mx m pt selection italic md border justify block ms text"></i> COPY MATRIX</div>
               </div>
            `;
        });
        
        document.getElementById('extractionHub').classList.remove('hidden');
    }

    function copyT(id) {
       const uNode = document.getElementById(id); 
       navigator.clipboard.writeText(uNode.innerText || uNode.textContent);
